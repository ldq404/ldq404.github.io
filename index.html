<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学习笔记</title>
  <link rel="stylesheet" href="./docsify-theme/macos.css" />
</head>
<body>
  <div id="app">正在加载...</div>
  <script>
    window.$docsify = {
      name: '首页',
      loadSidebar: true,
      subMaxLevel: 6,
      homepage: 'README.md',
      auto2top: true,
      themeColor: '#007aff',
      search: {
        paths: 'auto',
        placeholder: '搜索学习内容',
        noData: '没有找到相关内容'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Prism 语言组件：必须在 docsify 之后加载！
       docsify 4.x 内置打包了 Prism 核心，加载时会用内部核心覆盖 window.Prism，
       语言组件只有放在 docsify 之后才会注册到它内部的核心上，代码高亮才生效 -->
  <script src="./lib/prism-bash.min.js"></script>
  <script src="./lib/prism-go.min.js"></script>
  <script src="./lib/prism-java.min.js"></script>
  <script src="./lib/prism-json.min.js"></script>
  <script src="./lib/prism-jsx.min.js"></script>
  <script src="./lib/prism-markdown.min.js"></script>
  <script src="./lib/prism-python.min.js"></script>
  <script src="./lib/prism-sql.min.js"></script>
  <script src="./lib/prism-typescript.min.js"></script>
  <script src="./lib/prism-yaml.min.js"></script>
</body>
</html>
